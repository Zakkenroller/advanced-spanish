<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Adelante! — Spanish Grammar Trainer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="brand home-link" aria-label="Home">🇪🇸 ¡Adelante!</button>
    <div class="topbar-stats">
      <span class="stat" title="Experience points">⭐ <span id="xp">0</span> XP</span>
      <span class="stat" title="Current answer streak">🔥 <span id="streak">0</span></span>
      <span class="stat level-badge" id="current-level">No level set</span>
    </div>
  </header>

  <main>
    <!-- HOME -->
    <section id="view-home" class="view active">
      <div class="hero">
        <h1>Learn Spanish grammar at <em>your</em> level</h1>
        <p>Verb tenses, pronouns, and noun gender — from first steps to advanced nuance.
           Pick your CEFR level (each shows its rough Duolingo equivalent), or let a quick
           quiz place you.</p>
        <button class="btn primary big" id="placement-btn">🧭 Take the placement quiz (15 questions)</button>
      </div>

      <h2>Your level</h2>
      <div id="level-picker" class="level-picker"></div>

      <h2>Study &amp; practice</h2>
      <div id="topic-cards" class="topic-grid"></div>

      <footer class="foot">
        <button class="btn ghost small" id="reset-btn">Reset progress</button>
      </footer>
    </section>

    <!-- LESSON -->
    <section id="view-lesson" class="view">
      <button class="btn ghost small home-link">← Back</button>
      <h2 id="lesson-title"></h2>
      <div id="lesson-body" class="lesson-body card"></div>
      <button class="btn primary big" id="lesson-practice-btn">✏️ Practice this now</button>
    </section>

    <!-- PRACTICE -->
    <section id="view-practice" class="view">
      <div class="practice-head">
        <button class="btn ghost small home-link">← Quit</button>
        <h2 id="practice-title"></h2>
        <span id="practice-progress" class="practice-progress"></span>
      </div>
      <div class="progress-track big-track">
        <div class="progress-fill" id="practice-bar"></div>
      </div>
      <div id="question-box" class="card question-card"></div>
      <button class="btn primary big hidden" id="next-btn">Next →</button>
    </section>

    <!-- RESULTS -->
    <section id="view-results" class="view">
      <div class="card results-card">
        <h2 id="results-headline"></h2>
        <p id="results-sub"></p>
        <div id="results-adaptive" class="results-adaptive"></div>
        <div class="results-actions">
          <button class="btn primary big" id="again-btn">🔁 Practice again</button>
          <button class="btn ghost big home-link">🏠 Home</button>
        </div>
      </div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
